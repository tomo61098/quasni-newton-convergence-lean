name: Lean build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true
      - name: Audit axioms of proved results
        run: |
          lake build QuasiNewtonConvergence.AxiomAudit
          lake env lean ProofAudit.lean
      - name: Check axiom audit rejects untrusted proofs
        run: lake env lean ProofAuditTests.lean
